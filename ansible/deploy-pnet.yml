---
# The controller supplies an owner public key, network ID, and member
# certificates. The issuing key stays on the signer.

- name: Verify P-Net membership across the selected inventory
  hosts: all
  gather_facts: false
  become: true
  strategy: ansible.builtin.linear
  any_errors_fatal: true
  pre_tasks:
    - name: Validate tunnel probe settings before activation
      ansible.builtin.include_tasks: tasks/pnet-tunnel-probes.yml
      vars:
        pnet_validate_tunnel_probes: true
  roles:
    - role: pnet_candidate
      pnet_apply: false

- name: Activate the verified P-Net configuration one host at a time
  hosts: all
  gather_facts: false
  become: true
  strategy: ansible.builtin.linear
  any_errors_fatal: true
  serial: 1
  roles:
    - role: pnet_candidate
      pnet_apply: true
      when: not ansible_check_mode

- ansible.builtin.import_playbook: check-pnet-tunnels.yml
