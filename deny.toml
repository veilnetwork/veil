# cargo-deny policy (cycle-7 audit: the repo had no deny.toml, so a full
# `cargo deny check` failed at the license stage on every MIT/Apache dep).
#
# Scope of this gate: THIRD-PARTY dependency hygiene — advisories, sources, and
# license compliance. First-party (workspace) crates are MIT OR Apache-2.0 (the
# project license) and are skipped via `private.ignore` below; their license
# field is a packaging concern, not a dependency-policy one.
#
# Run:  cargo deny check        (all)
#       cargo deny check advisories sources licenses bans

[graph]
all-features = true

[advisories]
version = 2
# Fail on crates with an active RUSTSEC advisory or that have been yanked.
yanked = "deny"
# Consciously-accepted, tracked risks. These are `unmaintained` advisories (NOT
# active vulnerabilities): the PQClean upstream was archived, so its Rust
# bindings are flagged. All three are pulled in for the Falcon signature path
# and nothing else, so a single migration clears all three.
#
# A pure-Rust alternative now EXISTS: `fn-dsa` 0.4.0 (published 2026-07-22,
# pure Rust, MSRV 1.82, split into `fn-dsa-{kgen,sign,vrfy,comm}` so a
# verify-only consumer such as `veil-mailbox` can take just the vrfy half).
# RUSTSEC-2026-0165 recommends it by name. It is NOT yet a drop-in, and the
# reason is not maturity of the code but of the standard: the crate's own
# README states that no FN-DSA draft has been published, that 0.4.0 encodes a
# "best guess" at the coming FIPS 206 draft, and that backward compatibility
# will NOT be maintained until a post-standard 1.0. Its signatures are also
# fixed-size (666 B at n=512, 1280 B at n=1024) where the round-3 Falcon
# encoding these bindings emit is variable-length, so adopting it is a wire
# break, not a dependency bump.
#
# So: keep the current pin, treat the verifier-side length caps in
# `veil-crypto::signature` (`MAX_FALCON_SIG_BYTES`, `MAX_FALCON1024_SIG_BYTES`)
# as the practical mitigation, and migrate when `fn-dsa` ships a post-standard
# 1.0. Tracked in TASKS.md, "Deferred large-scope backlog" — row "Falcon /
# `pqcrypto-*` → `fn-dsa` migration".
# (Note: `cargo audit` did not surface these; `cargo deny` does.)
ignore = [
    "RUSTSEC-2026-0162", # pqcrypto-traits   — unmaintained (PQClean archived)
    "RUSTSEC-2026-0163", # pqcrypto-internals — unmaintained (PQClean archived)
    "RUSTSEC-2026-0165", # pqcrypto-falcon   — unmaintained (PQClean archived)
    # tun2proxy's embedded library path does not use its daemonize CLI helper.
    # Upstream 0.8.2 nevertheless declares it unconditionally for Unix. This
    # is a maintenance-only advisory, not an active vulnerability; retain the
    # exact tun2proxy pin and remove the exception once upstream feature-gates
    # or replaces daemonize.
    "RUSTSEC-2025-0069", # daemonize — unmaintained (tun2proxy CLI-only path)
    # Linux-only transitive compile-time macro dependency:
    # tun2proxy -> tproxy-config -> rtnetlink -> netlink-packet-core -> paste.
    # The advisory is maintenance-only. Remove when netlink-packet-core drops
    # paste; no runtime vulnerability is being accepted here.
    "RUSTSEC-2024-0436", # paste — unmaintained (netlink macro dependency)
]

[licenses]
version = 2
# Skip our own workspace crates (MIT OR Apache-2.0). This gate is about deps.
private = { ignore = true }
confidence-threshold = 0.9
# Permissive licenses present in the dependency tree (enumerated from
# `cargo deny list` 2026-05-31). Anything outside this set must be reviewed
# and added deliberately — a strong-copyleft dep (e.g. GPL) would be rejected.
allow = [
    # Permissive third-party licenses present in the dependency tree.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "WTFPL",
]
# No exceptions, and that is the point.
#
# `socks5-impl` (GPL-3.0-or-later) used to sit here. It was compatible while
# the workspace was AGPL-3.0-or-later and stopped being so under
# MIT OR Apache-2.0: a binary that links GPL code is GPL, whatever the source
# license field says. It reached two crates — veil-vpn-helper on Windows and
# veilclient-ffi under `packet-tunnel` — and SOCKS5 is how the tunnel talks to
# veil's own proxy, so it could not simply be dropped. It was replaced by a
# clean-room codec written from RFC 1928/1929
# (`third_party/tun2proxy/src/socks5_proto.rs`).
#
# Keep this list EMPTY. An exception is a licence decision wearing the clothes
# of a config line: the next GPL dependency must fail this gate and be argued
# for, not inherit a precedent set for a crate that is no longer here.
exceptions = []

[bans]
# Surface NEW first-party duplicate-version deps (WARN, non-blocking) without
# failing CI on the transitive ones we don't control. First-party crates have
# been unified (toml fully deduped; thiserror/socket2 direct deps moved to the
# current major). The remaining duplicates below are pulled by transitive
# upstreams and clear when those bump.
multiple-versions = "warn"
wildcards = "allow"
skip = [
    { name = "thiserror", version = "=1.0.69" }, # via tokio-socks 0.5
    { name = "rand", version = "=0.8.6" },        # via tungstenite 0.24 (transitive)
    { name = "rand", version = "=0.10.1" },       # via hickory-resolver 0.26 (transitive)
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
