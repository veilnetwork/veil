name: PR hygiene

# Lightweight pre-submit gate (audit follow-up 2026-06-03). Cheap, build-once
# hygiene only — fmt + clippy(-D warnings) + the policy scripts + cargo-audit —
# so a style/lint/poison/dead-code/advisory regression is caught before it
# lands. No test matrix, no Windows, no bench, no devnet.
#
# NOT on main. ci.yml runs on every push to main since 2026-08-30 and its
# hygiene job is these same checks, so leaving main here ran the whole set
# twice per push with two cache keys — and two copies of a policy check can
# disagree, which is worse than the minutes (report19 V19-L1). The two
# comments this replaces both described the arrangement before that change:
# the full CI is no longer tag-only, and a tag no longer triggers it at all.
on:
  pull_request:
  push:
    branches-ignore:
      - main
      - 'gh-readonly-queue/**'

# Cancel superseded runs on the same ref so rapid pushes don't pile up minutes.
concurrency:
  group: pr-hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege (audit V-03/V-05): nothing here publishes, so nothing here
# needs a token that can write to the repository.
permissions:
  contents: read

jobs:
  hygiene:
    name: Hygiene (fmt + clippy + policy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain (with rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hygiene-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hygiene-
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (warnings deny)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Mutex poison-recovery policy
        run: ./scripts/check-mutex-poison-policy.sh

      - name: '#[allow(dead_code)] anchor policy'
        run: ./scripts/check-allow-dead-code-anchors.sh

      - name: The triggers name a branch that exists
        # Cheapest question in the file, and the one nothing else asks: is
        # anything watching the branch the work lands on? This repository ran
        # for three months with the full CI reachable only by hand.
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # The parser first, against fixtures. It reads YAML by hand, and its
          # first version took only the first item of a block list — so
          # `[master, main]` and `[main, master]` gave different verdicts.
          ./scripts/check-workflow-branches.sh --self-test
          ./scripts/check-workflow-branches.sh

      - name: Cyrillic policy (runtime strings + CI tooling)
        run: ./scripts/check-cyrillic-runtime-strings.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --version "^0.22" --locked

      - name: cargo audit (RustSec advisory DB)
        run: cargo audit --deny warnings

      - name: cargo audit (fuzz lockfile)
        # report5: the fuzz crate excludes itself from the workspace (empty
        # `[workspace]`, for cargo-fuzz), so its lockfile is outside the audit
        # above and outside every build — see ci.yml for the long form.
        run: |
          cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
          cargo audit --deny warnings --file fuzz/Cargo.lock

      # NOT here: `cargo check --manifest-path fuzz/Cargo.toml`.
      #
      # It is the check this gate is missing — the steps above read the fuzz
      # crate's LOCKFILE and never build it, which is how `fuzz_cipher_open`
      # rotted unnoticed when audit V-01 moved `frame_aad` into veil_proto.
      # But `cargo check` runs its dependencies' build scripts, and
      # `libfuzzer-sys` compiles libFuzzer's own C++ in its own: on
      # ubuntu-latest that fails before any of this crate is looked at —
      # "conflicting types for 'bcmp'", "reinterpret_cast cannot resolve
      # overloaded function 'strstr'", five errors out of
      # FuzzerInterceptors.cpp. It passes on a macOS host, which is how it got
      # added and pushed red (run 31399080131).
      #
      # Wiring clang into this job would probably fix it, and that belongs in a
      # change someone can verify on Linux before it lands rather than in a
      # gate everyone else depends on.

      - name: Install cargo-deny
        run: cargo install cargo-deny --version "^0.19" --locked

      - name: cargo deny (advisories + bans + licenses + sources)
        # Supply-chain gate (config: deny.toml). Catches RustSec advisories
        # incl. `unmaintained` (which `cargo audit` does not surface), duplicate
        # major versions (warn), a license allow-list, and crates.io-only sources.
        run: cargo deny check
