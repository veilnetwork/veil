name: release

# Epic 484.1: deterministic release builds + signed UpdateManifest.
#
# Manually triggered (workflow_dispatch) — operator picks version,
# decides whether to draft a fresh GitHub Release or attach to existing
# tag.  Matrix builds for each supported target run in parallel; per-
# target artifacts (binary + sha256.txt + manifest.bin) are uploaded
# to the GitHub Release.
#
# Required GitHub repo secret:
#   VEIL_RELEASE_IDENTITY_TOML — full TOML body of the issuer
#                                   identity (algo + public_key +
#                                   private_key).  Cold-storage
#                                   release-signing key, distinct
#                                   from any node identity.
#
# Verification (any user can run this locally):
#   1. Download `veil-cli-<triple>` + `manifest.bin` from Release.
#   2. `sha256sum veil-cli-<triple>` matches `binary_sha256` field
#      decoded from the published manifest.
#   3. Independent rebuild: clone repo, checkout same tag, run
#      `scripts/build-release.sh --target <triple>
#       --source-date-epoch <commit-author-date>` — output should
#      have byte-identical SHA-256.
#
# Determinism enforced by `scripts/build-release.sh`:
#   * `SOURCE_DATE_EPOCH` pinned to the tagged commit's author date.
#   * `cargo build --locked` so Cargo.lock is not resolved fresh.
#   * `RUSTFLAGS=--remap-path-prefix` strips host paths from debug info.
#   * `CARGO_INCREMENTAL=0` so no per-machine state leaks in.

on:
  # A tag builds the artifacts. That is the whole point of tagging a release,
  # and doing it by hand meant the binaries lagged the tag — or, worse, were
  # built from a commit a later history rewrite had already orphaned.
  # The heavy test matrix does NOT run here: ci.yml is manual by design, and
  # hygiene is enforced by the local pre-tag gate.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver string (e.g. 1.2.3) — must match a git tag if release_existing.'
        required: true
        type: string
      min_compatible_version:
        description: 'Minimum installed version that may apply this update.'
        required: true
        type: string
      release_existing:
        description: 'Attach to existing GitHub Release (else create new draft).'
        required: false
        type: boolean
        default: false

# LEAST PRIVILEGE, per job (audit V-03). This was workflow-wide, so the matrix
# BUILD jobs held a token that can push to the repository and create releases —
# while running cargo, which executes every dependency's `build.rs`. Only the
# publish job attaches anything.
permissions:
  contents: read  # for release-attach

env:
  # A dispatch passes the bare semver ('0.4.1'); a tag push gives the ref name
  # ('v0.4.1'). Normalise both ways once, here, so no step has to care which
  # trigger it is running under.
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  # Attaching to an existing Release is an explicit dispatch choice; a tag push
  # always produces a DRAFT, because publishing is a decision a person makes
  # after looking at the artifacts.
  # Published, not drafted, the way hidden-volume has always released. A tag
  # push used to leave a draft: v0.8.2 built green across six targets and then
  # sat there, so `latest` answered v0.8.1 and a server reading it upgraded to
  # a version older than the one that had been cut. What decides whether a tag
  # deserves a release is the matrix above; holding the result back afterwards
  # adds a step, not a check. `release_existing` still attaches to a release
  # that is already there rather than making another.
  RELEASE_DRAFT: false

# Recovery only: publish verified artifacts built from immutable v0.11.41.
# This branch must not be merged as the default release workflow.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The ONE job that writes: it attaches the artifacts to the release.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: v0.11.41
          fetch-depth: 0

      - name: Verify immutable product tag and original successful builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=2d7d3ed6624d7b0c65b28e9afe1108c73bea8c32
          [ "$RELEASE_TAG" = v0.11.41 ]
          [ "$(git rev-parse HEAD)" = "$expected" ]
          [ "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38838142562 --jq .head_sha)" = "$expected" ]
          gh run view 38838142562 --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.name | startswith("build-"))] | length == 7 and all(.[]; .conclusion == "success")' \
            | grep -qx true


      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts/
          pattern: release-*
          run-id: 38838142562
          github-token: ${{ github.token }}

      - name: Verify the original artifacts against their checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(artifacts/release-*)
          [ "${#artifacts[@]}" -eq 7 ]
          for directory in "${artifacts[@]}"; do
            (cd "$directory" && sha256sum --check sha256.txt)
          done

      - name: Rename per-triple for release upload
        shell: bash
        run: |
          mkdir -p out/
          for d in artifacts/release-*/; do
            triple="$(basename "$d" | sed 's/^release-//')"
            for f in "$d"/*; do
              base="$(basename "$f")"
              # veil-cli         → veil-cli-<triple>
              # veil-cli.exe     → veil-cli-<triple>.exe
              # sha256.txt          → sha256-<triple>.txt
              # manifest.bin        → manifest-<triple>.bin
              ext=""
              stem="$base"
              case "$base" in
                *.exe) ext=".exe"; stem="${base%.exe}" ;;
                *.txt) ext=".txt"; stem="${base%.txt}" ;;
                *.bin) ext=".bin"; stem="${base%.bin}" ;;
              esac
              cp "$f" "out/${stem}-${triple}${ext}"
            done
          done
          ls -la out/

      # SECRET SCOPED TO THIS STEP (audit V-02). It used to sit in the job's
      # `env:`, so every step — checkout, the artifact download, the release
      # upload action — ran with the installer's long-lived signing key in its
      # environment. Only the step that signs needs it, and a key that signs
      # what users install is worth the two extra lines.
      - name: Sign sha256 manifests for the installer (Ed25519) — F2
        env:
          # F2: Ed25519 private key (openssl PEM) that signs the per-triple
          # sha256 manifests for the shell installer (scripts/install.sh).
          # OPTIONAL — when the secret is unset, no `.sig` is produced. NOTE
          # (audit V-01): install.sh now REFUSES to install without a verifiable
          # signature unless the user passes --skip-signature, so an unset
          # secret is no longer a silent downgrade for anyone who runs it.
          RELEASE_INSTALLER_ED25519_SK: ${{ secrets.RELEASE_INSTALLER_ED25519_SK }}
        # Detached Ed25519 signature over each per-triple sha256 manifest, so
        # scripts/install.sh can authenticate the manifest against a pinned key
        # BEFORE trusting any hash it lists (closes the "compromised release
        # artifact serves its own matching sha256" supply-chain gap). The `.sig`
        # files land in out/ and are picked up by the `out/*` glob below.
        # Skipped automatically when no signing secret is configured.
        if: ${{ env.RELEASE_INSTALLER_ED25519_SK != '' }}
        shell: bash
        run: |
          keyfile="$(mktemp)"; pubfile="$(mktemp)"
          printf '%s' "$RELEASE_INSTALLER_ED25519_SK" > "$keyfile"
          openssl pkey -in "$keyfile" -pubout -out "$pubfile"
          # Fail-fast: the secret's public half MUST equal the key pinned in
          # scripts/install.sh. Otherwise the installer would reject every
          # release we sign here (wrong-key verification failure). Catches a
          # mismatched/rotated secret at release time, not in users' installs.
          pinned="$(sed -n '/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/p' scripts/install.sh | tr -d '[:space:]')"
          derived="$(tr -d '[:space:]' < "$pubfile")"
          if [ -z "$pinned" ]; then
            echo "::error::no pinned public key in scripts/install.sh (pinned_release_pubkey is empty) — arm it before signing releases"; exit 1
          fi
          if [ "$pinned" != "$derived" ]; then
            echo "::error::RELEASE_INSTALLER_ED25519_SK public half does NOT match pinned_release_pubkey() in install.sh"; exit 1
          fi
          echo "secret public half matches the pinned installer key"
          shopt -s nullglob
          signed=0
          for f in out/sha256-*.txt; do
            openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$f" -out "$f.sig"
            # Ship-time self-check: the published .sig MUST verify under the
            # key's public half (catches a wrong / corrupt secret before release).
            openssl pkeyutl -verify -pubin -inkey "$pubfile" -rawin \
              -in "$f" -sigfile "$f.sig" \
              || { echo "::error::installer signature self-check failed for $f"; exit 1; }
            echo "signed + verified: $f.sig"
            signed=$((signed + 1))
          done
          rm -f "$keyfile" "$pubfile"
          [ "$signed" -gt 0 ] || { echo "::error::no sha256-*.txt manifests to sign"; exit 1; }

      # The release page carries the CHANGELOG entry for this tag, not a list
      # of commit subjects. `generate_release_notes: true` produced exactly one
      # line -- a compare link -- for v0.6.0, under 43 artifacts nobody could
      # then read a description of. Artifacts whose notes nobody can read are
      # artifacts nobody can check.
      - name: Release notes from the CHANGELOG entry for this tag
        run: |
          set -euo pipefail
          # index(...) == 1 rather than a regex: the version is full of dots,
          # and as a pattern v0.1.0 would match the heading of v0.10.0. The
          # em-dash that follows the version is part of the needle for the
          # same reason -- v0.6.0 must not match v0.6.0-rc1.
          awk -v v="$RELEASE_TAG" '(index($0, "## " v " —") == 1 || index($0, "## [" substr(v,2) "] -") == 1) {f=1; print; next}
                                   f && /^## / {exit}
                                   f {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $RELEASE_TAG, so this release would publish with an empty page. Add the entry, then move the tag."
            exit 1
          fi
          echo "notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines from the $RELEASE_TAG entry"

      - name: Attach to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ env.RELEASE_DRAFT }}
          files: out/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/notes.md

      # The action above writes the body only when it CREATES the release. Move
      # a tag and re-run, and it replaces every asset while leaving the notes
      # from the first attempt in place -- fresh binaries under a stale page,
      # which is the harder half to notice: an empty body is obviously broken,
      # a confidently outdated one reads as fine.
      - name: The notes must match the tag, not the first attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > "$RUNNER_TEMP/published-notes.md"
          # Compare the CONTENT, not the trailing whitespace. `-q .body` writes
          # its own closing newline and the API hands the body back with CRLF
          # endings, so a byte-for-byte `diff` calls a correct page wrong. That
          # is not hypothetical: v0.7.0 built all seven targets, attached them,
          # wrote the right 7812 bytes of notes -- and this step failed it over
          # ONE empty line. A guard that cries wolf on every release is one
          # nobody reads, which costs more than the drift it was built to catch.
          python3 - "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/published-notes.md" <<'PY'
          import difflib, sys
          def read(p):
              return open(p, encoding="utf-8").read().replace("\r\n", "\n").rstrip("\n")
          want, got = read(sys.argv[1]), read(sys.argv[2])
          if want != got:
              print("::error::the release page does not carry the CHANGELOG entry")
              sys.stdout.writelines(difflib.unified_diff(
                  want.splitlines(True), got.splitlines(True), "expected", "published"))
              sys.exit(1)
          print(f"notes on the release page match ({len(want)} bytes)")
          PY
