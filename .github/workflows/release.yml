name: release

# Epic 484.1: deterministic release builds + signed UpdateManifest.
#
# Manually triggered (workflow_dispatch) — operator picks version,
# decides whether to draft a fresh GitHub Release or attach to existing
# tag.  Matrix builds for each supported target run in parallel; per-
# target artifacts (binary + sha256.txt + manifest.bin) are uploaded
# to the GitHub Release.
#
# Required GitHub repo secret:
#   VEIL_RELEASE_IDENTITY_TOML — full TOML body of the issuer
#                                   identity (algo + public_key +
#                                   private_key).  Cold-storage
#                                   release-signing key, distinct
#                                   from any node identity.
#
# Verification (any user can run this locally):
#   1. Download `veil-cli-<triple>` + `manifest.bin` from Release.
#   2. `sha256sum veil-cli-<triple>` matches `binary_sha256` field
#      decoded from the published manifest.
#   3. Independent rebuild: clone repo, checkout same tag, run
#      `scripts/build-release.sh --target <triple>
#       --source-date-epoch <commit-author-date>` — output should
#      have byte-identical SHA-256.
#
# Determinism enforced by `scripts/build-release.sh`:
#   * `SOURCE_DATE_EPOCH` pinned to the tagged commit's author date.
#   * `cargo build --locked` so Cargo.lock is not resolved fresh.
#   * `RUSTFLAGS=--remap-path-prefix` strips host paths from debug info.
#   * `CARGO_INCREMENTAL=0` so no per-machine state leaks in.

on:
  # A tag builds the artifacts. That is the whole point of tagging a release,
  # and doing it by hand meant the binaries lagged the tag — or, worse, were
  # built from a commit a later history rewrite had already orphaned.
  # The heavy test matrix does NOT run here: ci.yml is manual by design, and
  # hygiene is enforced by the local pre-tag gate.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver string (e.g. 1.2.3) — must match a git tag if release_existing.'
        required: true
        type: string
      min_compatible_version:
        description: 'Minimum installed version that may apply this update.'
        required: true
        type: string
      release_existing:
        description: 'Attach to existing GitHub Release (else create new draft).'
        required: false
        type: boolean
        default: false

# LEAST PRIVILEGE, per job (audit V-03). This was workflow-wide, so the matrix
# BUILD jobs held a token that can push to the repository and create releases —
# while running cargo, which executes every dependency's `build.rs`. Only the
# publish job attaches anything.
permissions:
  contents: read  # for release-attach

env:
  # A dispatch passes the bare semver ('0.4.1'); a tag push gives the ref name
  # ('v0.4.1'). Normalise both ways once, here, so no step has to care which
  # trigger it is running under.
  RELEASE_TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  # Attaching to an existing Release is an explicit dispatch choice; a tag push
  # always produces a DRAFT, because publishing is a decision a person makes
  # after looking at the artifacts.
  RELEASE_DRAFT: ${{ github.event_name != 'workflow_dispatch' || !inputs.release_existing }}

jobs:
  build:
    name: build-${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          # Static-musl build: same x86_64 platform but linked against
          # musl libc.  Produced specifically for older Linux distros
          # whose glibc lacks symbols GitHub's ubuntu-latest images bring
          # (the runner pins a very recent glibc — binaries built there
          # otherwise fail on old hosts with "GLIBC_2.39 not found").
          # musl artifact runs on any Linux kernel ≥ 3.2 regardless of
          # the host's libc version.
          - triple: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            install_musl: true
          # aarch64 static-musl: same no-glibc portability for ARM Linux
          # (servers, SBCs). Cross-compiled by zig via cargo-zigbuild.
          - triple: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            install_musl: true
          - triple: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross_linker: aarch64-linux-gnu-gcc
          - triple: aarch64-apple-darwin
            runner: macos-14
          - triple: x86_64-pc-windows-msvc
            runner: windows-latest
            is_windows: true
          # Native Windows on ARM64. Cross-compiled from the x64 runner with
          # clang-cl --target=aarch64-pc-windows-msvc.
          - triple: aarch64-pc-windows-msvc
            runner: windows-latest
            is_windows: true

    runs-on: ${{ matrix.runner }}
    # A hang here used to cost the runner's six-hour default. Every leg of
    # this matrix has finished in well under fifteen minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Compute SOURCE_DATE_EPOCH from HEAD
        id: epoch
        shell: bash
        run: echo "value=$(git log -1 --pretty=%ct)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      # rust-toolchain.toml pins the channel, and the action above installs the
      # target for whatever IT installed — not for the pinned toolchain cargo
      # actually runs. Add it explicitly, which resolves through the pin. This
      # is the same step mobile-build.yml already carries, and it was missing
      # here: this is the workflow a TAG starts, so the omission could only
      # ever surface as a broken release. Four of the seven legs are cross
      # targets (both musl triples, aarch64-gnu, aarch64-windows) and each
      # would have failed on `error[E0463]: can't find crate for 'core'` —
      # the pinned toolchain brings only the host plus what rust-toolchain.toml
      # names, and it names one gnu-windows target for the gates.
      - name: Add the cross target to the PINNED toolchain
        run: rustup target add ${{ matrix.triple }}

      # BOUNDED, because the unbounded form hung a v0.6.0 release leg for two
      # and a half hours with no output at all — six of the seven targets were
      # built and waiting on this one. Two things make apt wait forever here:
      # the runner image runs unattended-upgrades, whose dpkg lock apt waits on
      # silently under `-qq`, and a package that wants to ask something gets no
      # terminal to ask it on. `DPkg::Lock::Timeout` turns the first into an
      # error, `DEBIAN_FRONTEND` answers the second, and the retry covers the
      # ordinary case of losing the lock race once.
      # Twenty-five minutes, not ten, and recommends left on. Both are paid for.
      #
      # The ceiling is a backstop, not the defence: `DPkg::Lock::Timeout` turns
      # the hang this step exists to bound into an error in three minutes
      # whatever the ceiling says. What the ceiling has to outlast is an
      # ordinary slow day on the mirror -- a sibling repository measured
      # 15m53s for a comparable package set on this same runner host, having
      # been killed at ten the attempt before.
      #
      # And `--no-install-recommends` is gone. The target libc headers reach
      # `gcc-aarch64-linux-gnu` through Recommends, not Depends; this step only
      # survived the flag because `g++-aarch64-linux-gnu` sits beside it and
      # pulls them as a hard dependency. That is luck, not a contract, and the
      # same flag cost a sibling repository a red tag on
      # `bits/libc-header-start.h`. `libc6-dev-arm64-cross` is named outright.
      - name: Install ARM64 Linux cross-linker
        if: matrix.cross_linker == 'aarch64-linux-gnu-gcc'
        timeout-minutes: 25
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=180 -o Acquire::Retries=3 "$@"
          }
          for attempt in 1 2 3; do
            if apt_get update -qq && \
               apt_get install -y \
                 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                 libc6-dev-arm64-cross; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 15
          done
          echo "::error::could not install the aarch64 cross-linker in three attempts"
          exit 1

      - name: Install cargo-zigbuild (musl C/C++ cross via zig)
        if: matrix.install_musl == true
        run: |
          # The release binaries default to rocksdb-cold + tls-boring, so the
          # musl target must cross-compile RocksDB and BoringSSL (C++). The
          # musl.cc gcc cross-toolchain host is unreliable, so use zig instead:
          # it ships a complete clang + musl libc + libc++ and cross-compiles
          # C/C++ deps without an external toolchain download. zig and
          # cargo-zigbuild both install from PyPI (reliable). build-release.sh
          # then runs `cargo zigbuild` for this target via VEIL_CARGO_CMD.
          # Pinned for reproducibility — bump deliberately (supply-chain).
          pip3 install --user "cargo-zigbuild==0.22.3" "ziglang==0.16.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "VEIL_CARGO_CMD=zigbuild" >> "$GITHUB_ENV"

      - name: Build release binaries (Unix)
        if: matrix.is_windows != true
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
          # blake3 (NEON C) + rocksdb (C++) build via cc-rs; without a target
          # CC/CXX they fall back to host clang and miss the aarch64 multiarch
          # headers (bits/wordsize.h not found). Point them at the cross gcc.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          # musl cross env (CC/CXX/AR/LINKER/BINDGEN/CMAKE_TOOLCHAIN_FILE) is set
          # by the "Install musl cross toolchain" step via $GITHUB_ENV.
        run: |
          ./scripts/build-release.sh \
            --target ${{ matrix.triple }} \
            --source-date-epoch ${{ steps.epoch.outputs.value }}

      - name: Build release binaries (Windows)
        if: matrix.is_windows == true
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: '--remap-path-prefix=${{ github.workspace }}=. --remap-path-prefix=C:\=/'
          # The repo-global [env] CC=clang/CXX=clang++ (.cargo/config.toml, a
          # rocksdb header workaround) is a gnu-driver clang and chokes on the
          # MSVC-style flags crates add for *-windows-msvc (e.g. pqcrypto's
          # /arch:AVX2). Use clang-cl (the MSVC driver) for this target.
          CC_x86_64_pc_windows_msvc: clang-cl
          CXX_x86_64_pc_windows_msvc: clang-cl
          CC_aarch64_pc_windows_msvc: clang-cl
          CXX_aarch64_pc_windows_msvc: clang-cl
          # Drop the global gnu force-include (-include cstdint, .cargo/config.toml)
          # on this target: cl rejects the gnu form, and the MSVC /FI form gets
          # mangled by git-bash MSYS path conversion (/FI -> C:/.../FI). MSVC's STL
          # pulls <cstdint> in transitively, so rocksdb's headers compile without it.
          CXXFLAGS: ''
        run: |
          # Phase 6.50.b audit fix: switched from allow-empty-seeds to
          # production-seeds.  Pre-fix a CI release artifact for Windows
          # would be built without builtin seeds, producing a binary that
          # won't bootstrap without manual peer config.  Now matches the
          # Unix path through scripts/build-release.sh (which also
          # defaults to production-seeds).  For testnet artifacts use
          # a separate workflow that explicitly opts in.
          cargo build --release --target ${{ matrix.triple }} --locked \
            --bin veil-cli --bin ogate --bin oproxy-client --bin oproxy-server \
            --features veil-bootstrap/production-seeds
          stage="target/release-artifacts/${{ matrix.triple }}"
          mkdir -p "$stage"
          : > "$stage/sha256.txt"
          for b in veil-cli ogate oproxy-client oproxy-server; do
            src="target/${{ matrix.triple }}/release/${b}.exe"
            cp "$src" "$stage/"
            sha256sum "$stage/${b}.exe" | awk -v n="${b}.exe" '{print $1"  "n}' >> "$stage/sha256.txt"
          done

      # WRITTEN AFTER THE BUILD (audit V-02). The update-signing identity used
      # to land on disk BEFORE `cargo build`, and cargo runs every dependency's
      # `build.rs` with full filesystem access — so any package in the tree, at
      # any depth, could read the key that signs updates for every user. The
      # secret was already step-scoped; the FILE was not, and the file is what a
      # build script reads. Nothing between the build and the signature needs
      # it, so it now exists only for the step that uses it.
      - name: Write release-signing identity (Linux host job only)
        id: identity
        if: matrix.runner == 'ubuntu-latest' && matrix.triple == 'x86_64-unknown-linux-gnu'
        env:
          IDENTITY_TOML: ${{ secrets.VEIL_RELEASE_IDENTITY_TOML }}
        run: |
          mkdir -p $RUNNER_TEMP/release-key
          umask 077
          printf '%s' "$IDENTITY_TOML" > $RUNNER_TEMP/release-key/identity.toml
          echo "path=$RUNNER_TEMP/release-key/identity.toml" >> "$GITHUB_OUTPUT"

      - name: Sign manifest (host build only — has signing key)
        if: steps.identity.outputs.path != ''
        run: |
          set -euo pipefail
          # A tag push hands us 'v0.4.1'; build-release.sh wants bare semver.
          VERSION="${VERSION#v}"
          # No automatic value for min-compatible is defensible in general, so
          # fall back to the .0 of this minor line: 0.4.1 accepts updates from
          # 0.4.0 up. Override with a dispatch when a release needs different
          # reach.
          if [ -z "$MIN_COMPAT" ]; then
            MIN_COMPAT="${VERSION%.*}.0"
          fi
          echo "version=$VERSION min-compatible=$MIN_COMPAT"
          ./scripts/build-release.sh \
            --target ${{ matrix.triple }} \
            --source-date-epoch ${{ steps.epoch.outputs.value }} \
            --sign \
            --identity ${{ steps.identity.outputs.path }} \
            --version "$VERSION" \
            --min-compatible-version "$MIN_COMPAT" \
            --binary-url "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/veil-cli-${{ matrix.triple }}"
        env:
          # `min_compatible_version` has no sane automatic value, so a tag push
          # defaults to the .0 of its own minor line: 0.4.1 accepts updates
          # from 0.4.0 and up. Widen or narrow it with a dispatch when a
          # release needs different reach.
          VERSION: ${{ inputs.version || github.ref_name }}
          MIN_COMPAT: ${{ inputs.min_compatible_version }}

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-${{ matrix.triple }}
          path: target/release-artifacts/${{ matrix.triple }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The ONE job that writes: it attaches the artifacts to the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts/

      - name: Rename per-triple for release upload
        shell: bash
        run: |
          mkdir -p out/
          for d in artifacts/release-*/; do
            triple="$(basename "$d" | sed 's/^release-//')"
            for f in "$d"/*; do
              base="$(basename "$f")"
              # veil-cli         → veil-cli-<triple>
              # veil-cli.exe     → veil-cli-<triple>.exe
              # sha256.txt          → sha256-<triple>.txt
              # manifest.bin        → manifest-<triple>.bin
              ext=""
              stem="$base"
              case "$base" in
                *.exe) ext=".exe"; stem="${base%.exe}" ;;
                *.txt) ext=".txt"; stem="${base%.txt}" ;;
                *.bin) ext=".bin"; stem="${base%.bin}" ;;
              esac
              cp "$f" "out/${stem}-${triple}${ext}"
            done
          done
          ls -la out/

      # SECRET SCOPED TO THIS STEP (audit V-02). It used to sit in the job's
      # `env:`, so every step — checkout, the artifact download, the release
      # upload action — ran with the installer's long-lived signing key in its
      # environment. Only the step that signs needs it, and a key that signs
      # what users install is worth the two extra lines.
      - name: Sign sha256 manifests for the installer (Ed25519) — F2
        env:
          # F2: Ed25519 private key (openssl PEM) that signs the per-triple
          # sha256 manifests for the shell installer (scripts/install.sh).
          # OPTIONAL — when the secret is unset, no `.sig` is produced. NOTE
          # (audit V-01): install.sh now REFUSES to install without a verifiable
          # signature unless the user passes --skip-signature, so an unset
          # secret is no longer a silent downgrade for anyone who runs it.
          RELEASE_INSTALLER_ED25519_SK: ${{ secrets.RELEASE_INSTALLER_ED25519_SK }}
        # Detached Ed25519 signature over each per-triple sha256 manifest, so
        # scripts/install.sh can authenticate the manifest against a pinned key
        # BEFORE trusting any hash it lists (closes the "compromised release
        # artifact serves its own matching sha256" supply-chain gap). The `.sig`
        # files land in out/ and are picked up by the `out/*` glob below.
        # Skipped automatically when no signing secret is configured.
        if: ${{ env.RELEASE_INSTALLER_ED25519_SK != '' }}
        shell: bash
        run: |
          keyfile="$(mktemp)"; pubfile="$(mktemp)"
          printf '%s' "$RELEASE_INSTALLER_ED25519_SK" > "$keyfile"
          openssl pkey -in "$keyfile" -pubout -out "$pubfile"
          # Fail-fast: the secret's public half MUST equal the key pinned in
          # scripts/install.sh. Otherwise the installer would reject every
          # release we sign here (wrong-key verification failure). Catches a
          # mismatched/rotated secret at release time, not in users' installs.
          pinned="$(sed -n '/-----BEGIN PUBLIC KEY-----/,/-----END PUBLIC KEY-----/p' scripts/install.sh | tr -d '[:space:]')"
          derived="$(tr -d '[:space:]' < "$pubfile")"
          if [ -z "$pinned" ]; then
            echo "::error::no pinned public key in scripts/install.sh (pinned_release_pubkey is empty) — arm it before signing releases"; exit 1
          fi
          if [ "$pinned" != "$derived" ]; then
            echo "::error::RELEASE_INSTALLER_ED25519_SK public half does NOT match pinned_release_pubkey() in install.sh"; exit 1
          fi
          echo "secret public half matches the pinned installer key"
          shopt -s nullglob
          signed=0
          for f in out/sha256-*.txt; do
            openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$f" -out "$f.sig"
            # Ship-time self-check: the published .sig MUST verify under the
            # key's public half (catches a wrong / corrupt secret before release).
            openssl pkeyutl -verify -pubin -inkey "$pubfile" -rawin \
              -in "$f" -sigfile "$f.sig" \
              || { echo "::error::installer signature self-check failed for $f"; exit 1; }
            echo "signed + verified: $f.sig"
            signed=$((signed + 1))
          done
          rm -f "$keyfile" "$pubfile"
          [ "$signed" -gt 0 ] || { echo "::error::no sha256-*.txt manifests to sign"; exit 1; }

      # The release page carries the CHANGELOG entry for this tag, not a list
      # of commit subjects. `generate_release_notes: true` produced exactly one
      # line -- a compare link -- for v0.6.0, under 43 artifacts nobody could
      # then read a description of. Artifacts whose notes nobody can read are
      # artifacts nobody can check.
      - name: Release notes from the CHANGELOG entry for this tag
        run: |
          set -euo pipefail
          # index(...) == 1 rather than a regex: the version is full of dots,
          # and as a pattern v0.1.0 would match the heading of v0.10.0. The
          # em-dash that follows the version is part of the needle for the
          # same reason -- v0.6.0 must not match v0.6.0-rc1.
          awk -v v="$RELEASE_TAG" 'index($0, "## " v " —") == 1 {f=1; print; next}
                                   f && /^## / {exit}
                                   f {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no section for $RELEASE_TAG, so this release would publish with an empty page. Add the entry, then move the tag."
            exit 1
          fi
          echo "notes: $(wc -l < "$RUNNER_TEMP/notes.md") lines from the $RELEASE_TAG entry"

      - name: Attach to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ env.RELEASE_DRAFT }}
          files: out/*
          fail_on_unmatched_files: true
          body_path: ${{ runner.temp }}/notes.md

      # The action above writes the body only when it CREATES the release. Move
      # a tag and re-run, and it replaces every asset while leaving the notes
      # from the first attempt in place -- fresh binaries under a stale page,
      # which is the harder half to notice: an empty body is obviously broken,
      # a confidently outdated one reads as fine.
      - name: The notes must match the tag, not the first attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json body -q .body > "$RUNNER_TEMP/published-notes.md"
          # Compare the CONTENT, not the trailing whitespace. `-q .body` writes
          # its own closing newline and the API hands the body back with CRLF
          # endings, so a byte-for-byte `diff` calls a correct page wrong. That
          # is not hypothetical: v0.7.0 built all seven targets, attached them,
          # wrote the right 7812 bytes of notes -- and this step failed it over
          # ONE empty line. A guard that cries wolf on every release is one
          # nobody reads, which costs more than the drift it was built to catch.
          python3 - "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/published-notes.md" <<'PY'
          import difflib, sys
          def read(p):
              return open(p, encoding="utf-8").read().replace("\r\n", "\n").rstrip("\n")
          want, got = read(sys.argv[1]), read(sys.argv[2])
          if want != got:
              print("::error::the release page does not carry the CHANGELOG entry")
              sys.stdout.writelines(difflib.unified_diff(
                  want.splitlines(True), got.splitlines(True), "expected", "published"))
              sys.exit(1)
          print(f"notes on the release page match ({len(want)} bytes)")
          PY
