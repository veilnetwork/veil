name: mobile-cross-compile

# Epic 489.2: cross-compile veilclient-ffi for Android + iOS + macOS
# desktop targets that the Flutter plugin pubspec.yaml declares.  Uploads
# a ready-to-bundle artifact per target so the Flutter plugin's
# `android/build.gradle` + iOS Podspec can pull straight from the run.
#
# Manually triggered or on git tag push (release flow).  Skipped on
# regular pushes — full matrix takes ~15-20 min and isn't load-bearing
# for the daemon-side CI.
#
# Every leg calls `scripts/build-mobile.sh`, the same script a developer runs,
# rather than spelling out its own `cargo build`.  It used to spell them out,
# and they drifted: the script built with `production-seeds,node-embedded,
# packet-tunnel` while this file passed `production-seeds` alone.  So the
# artifacts uploaded here had no in-process node — the thing iOS cannot work
# without and the deniable posture on Android depends on — and nothing said so.
# The iOS legs had drifted further still: the script emits a staticlib through
# `cargo rustc` and sets the bindgen triple for the simulator targets, neither
# of which this file did.  Two definitions of one artifact is the defect; one
# is the fix.

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'
      - 'v*'

# Least privilege (audit V-03/V-05): nothing here publishes, so nothing here
# needs a token that can write to the repository.
permissions:
  contents: read

jobs:
  android:
    name: android-${{ matrix.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        triple:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.triple }}

      # rust-toolchain.toml pins the channel, and the action above installs the
      # target for whatever IT installed — not for the pinned toolchain cargo
      # actually runs. Add it explicitly, which resolves through the pin.
      - name: Add the cross target to the PINNED toolchain
        run: rustup target add ${{ matrix.triple }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26d

      - name: Cross-compile ffi
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        # Features, the NDK platform level and everything else live in the
        # script. This is the release/tag flow, so the script's default
        # `production-seeds` (BUILTIN_SEEDS baked in) is what we want, and its
        # VEIL_MOBILE_DEV guard makes the bootstrap-less `allow-empty-seeds`
        # impossible to reach from here by accident.
        run: scripts/build-mobile.sh --target ${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ffi-${{ matrix.triple }}
          path: |
            target/${{ matrix.triple }}/release/libveilclient_ffi.so
            target/${{ matrix.triple }}/release/libveilclient_ffi.a

  ios-and-macos:
    name: apple-${{ matrix.triple }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        triple:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - x86_64-apple-ios
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.triple }}

      - name: Add the cross target to the PINNED toolchain
        run: rustup target add ${{ matrix.triple }}

      # The script owns the iOS specifics this file used to get wrong: a
      # staticlib via `cargo rustc` (Apple disallows third-party dylibs in iOS
      # apps), the `-simulator` bindgen triple the sim targets need, and the
      # iOS 13.0 deployment floor.
      - name: Cross-compile ffi
        run: scripts/build-mobile.sh --target ${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ffi-${{ matrix.triple }}
          path: |
            target/${{ matrix.triple }}/release/libveilclient_ffi.dylib
            target/${{ matrix.triple }}/release/libveilclient_ffi.a

  ios-xcframework:
    # Combine the per-arch iOS staticlibs into a single .xcframework that
    # the Flutter plugin's Podspec consumes.  Runs after the apple-* legs
    # finish so it can pull their artifacts.
    name: ios-xcframework
    runs-on: macos-14
    needs: ios-and-macos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download device slice
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ffi-aarch64-apple-ios
          path: target/aarch64-apple-ios/release

      - name: Download sim arm64 slice
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ffi-aarch64-apple-ios-sim
          path: target/aarch64-apple-ios-sim/release

      - name: Download sim x86_64 slice
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ffi-x86_64-apple-ios
          path: target/x86_64-apple-ios/release

      - name: Build xcframework
        run: scripts/build-xcframework.sh

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: VeilClientFFI.xcframework
          path: target/xcframework/VeilClientFFI.xcframework

  linux-desktop:
    name: linux-${{ matrix.triple }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        triple:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.triple }}

      - name: Add the cross target to the PINNED toolchain
        run: rustup target add ${{ matrix.triple }}

      - name: Install cross-linker for ARM64
        if: matrix.triple == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -qq
          # No --no-install-recommends here: the target libc headers reach
          # gcc-aarch64-linux-gnu through Recommends, not Depends. This step
          # only survived the flag because g++ pulls them as a hard dependency
          # -- luck, not a contract. libc6-dev-arm64-cross is named outright.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      # The cross toolchain env stays here — it is about THIS runner, not about
      # what a veilclient-ffi artifact is. The features are the script's.
      - name: Cross-compile ffi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # blake3 (NEON C) + rocksdb (C++) compile via cc-rs; without a
          # target CC/CXX they use host clang and miss the aarch64 multiarch
          # headers (bits/wordsize.h not found). Point them at the cross gcc.
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: scripts/build-mobile.sh --target ${{ matrix.triple }}

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ffi-${{ matrix.triple }}
          path: |
            target/${{ matrix.triple }}/release/libveilclient_ffi.so
            target/${{ matrix.triple }}/release/libveilclient_ffi.a
