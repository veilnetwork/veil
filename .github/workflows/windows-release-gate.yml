name: Windows release gate

on:
  workflow_dispatch:
  # Several crates carry Windows-only code that no developer machine on this
  # project can compile, let alone run. This is the only host that can, so a
  # PR touching one of them has to come through here — otherwise the
  # `#[cfg(windows)]` arms are reviewed by eye and shipped untested.
  #
  # veil-local-transport: the named-pipe listener.
  # veilclient-ffi: the embedded node's boot path. It was watching only
  #   local-transport that let a Windows build ship which could not start a
  #   node AT ALL — the host handed it a bare `C:\...\admin.sock`, the FFI
  #   wrapped it `unix://` and pasted it into a TOML template, and `\U` opened
  #   a unicode escape. Nothing on this gate had ever executed that path.
  # veil-cfg: owns `admin_socket` parsing and the `not(unix)` endpoint default
  #   the embedded node now relies on.
  pull_request:
    paths:
      - 'crates/veil-local-transport/**'
      - 'crates/veilclient-ffi/**'
      - 'crates/veil-cfg/**'
      - '.github/workflows/windows-release-gate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-tests:
    name: Windows native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      # First, and without the clang-cl detour: this crate has no C deps,
      # and its named-pipe tests are the ones that cannot run anywhere else.
      # Failing here should not wait on a veilcore build.
      - name: Run local-transport tests (named-pipe name ownership)
        run: cargo test -p veil-local-transport
      - name: Build core without RocksDB
        env:
          CC: clang-cl
          CXX: clang-cl
        run: cargo build -p veilcore --lib --no-default-features
      - name: Run TCP admin integration tests
        env:
          CC: clang-cl
          CXX: clang-cl
        run: cargo test -p veilcore --lib --no-default-features node::admin::tests::admin_tcp -- --ignored --test-threads=1
      - name: Run token-file helpers
        env:
          CC: clang-cl
          CXX: clang-cl
        run: cargo test -p veilcore --lib --no-default-features node::admin_transport::tests -- --test-threads=1

  embedded-node:
    name: Windows embedded node (veilclient-ffi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ffi-${{ hashFiles('**/Cargo.lock') }}
      # `--no-default-features` drops `tls-boring`, so this needs no cmake or
      # BoringSSL build; the node boot path under test does not use it.
      - name: Build the embedded node FFI
        env:
          CC: clang-cl
          CXX: clang-cl
        run: >-
          cargo build -p veilclient-ffi --lib
          --no-default-features --features node-embedded

      # WHAT THE DLL ACTUALLY OFFERS, which is the question the build's exit
      # code does not answer.
      #
      # `#![cfg(unix)]` at the crate root made every one of these compile to
      # nothing off Unix. `cargo build` still exited 0 and produced a DLL, and
      # that DLL shipped: the published v0.9.1 bundle carries a 105 KB
      # veilclient_ffi.dll whose export address table has ZERO entries, beside
      # a hidden_volume_ffi.dll with 285. So the Windows app has had no way to
      # reach the network at all, and every gate around it was green — this one
      # included, because it only ever asked whether the build succeeded.
      #
      # dumpbin reads the export table, which is the table GetProcAddress
      # consults. A symbol listing would answer a different question: `nm`
      # reports symbols that are defined but not exported, and a DLL can define
      # everything and export none of it.
      #
      # The floor is a floor, not a non-empty test: a regex that stops matching
      # would otherwise shrink the count silently and agree with itself. The
      # header declares well over a hundred entry points; fifty is the alarm.
      - name: The DLL exports what the app looks up
        shell: pwsh
        run: |
          $dll = "target/debug/veilclient_ffi.dll"
          if (-not (Test-Path $dll)) { throw "no DLL at $dll" }
          $rows = (& dumpbin.exe /EXPORTS $dll) |
            Select-String -Pattern '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          $veil = $rows | Where-Object { $_ -like 'veil_*' } | Sort-Object -Unique
          Write-Host "exported veil_* entry points: $($veil.Count)"
          if ($veil.Count -lt 50) {
            throw "::error::the DLL exports $($veil.Count) veil_* entry points. A build that succeeds and exports nothing is what shipped in v0.9.1."
          }
          # The one the Dart side reads BEFORE any other lookup: without it the
          # app refuses the library outright, so its absence is not a partial
          # failure but a total one.
          if ($veil -notcontains 'veil_abi_contract_hash') {
            throw "::error::veil_abi_contract_hash is not exported; the app checks it before every other symbol"
          }

      # Composition is where the shipped Windows build actually died, and it is
      # pure string work — fast, and it fails loudly if the TOML escaping
      # regresses.
      #
      # Both test steps prove they RAN. A cargo filter that matches nothing
      # still exits 0, so a renamed test would leave this gate green having
      # executed none of it — the exact failure mode the gate exists to end.
      - name: Compose a config from a Windows runtime path
        shell: bash
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          # `|| rc=$?`, not a bare call: this shell runs with `-e`, so a genuine
          # test FAILURE used to abort the step before `cat compose.log` — the
          # gate swallowed the very output it exists to show.
          rc=0
          cargo test -p veilclient-ffi --lib \
            --no-default-features --features node-embedded,test-low-difficulty \
            node::tests::config_compose -- --test-threads=1 > compose.log 2>&1 || rc=$?
          cat compose.log
          if ! grep -qE '[1-9][0-9]* passed' compose.log; then
            # Two different zeros that mean opposite things. A filter matching
            # nothing still leaves a NON-zero `filtered out` count. Zero passed
            # AND zero filtered out means the harness holds no tests at all,
            # which is not a filter problem: veilclient-ffi/src/lib.rs carries a
            # crate-level `#![cfg(unix)]`, so on Windows the crate, its tests
            # and the embedded node all compile to nothing. Say so, rather than
            # sending the next reader after a filter that is perfectly correct.
            if grep -q '; 0 filtered out' compose.log; then
              echo "::error::veilclient-ffi compiled to an EMPTY crate here (0 tests AND 0 filtered out). src/lib.rs is #![cfg(unix)], so there is no embedded node on Windows to test. The filter is correct — the crate is absent. This job cannot mean anything until that gate is lifted."
            else
              echo "::error::no compose test ran — check the filter"
            fi
            exit 1
          fi
          exit $rc
      # The real proof, and the first time any of it has run on Windows:
      # compose against a genuine `C:\Users\...\Temp\...` directory, boot a
      # deferred node on it, wait for the admin.port/admin.token sidecars to
      # appear, promote it with apply-config over that admin connection, stop
      # it, and boot a second node in the same directory to show the sidecars
      # it left do not wedge the next launch.
      - name: Boot an embedded node on a Windows runtime directory
        shell: bash
        env:
          CC: clang-cl
          CXX: clang-cl
        run: |
          # `|| rc=$?` for the same reason as the compose step: `-e` would
          # otherwise abort before the log is printed.
          rc=0
          cargo test -p veilclient-ffi --lib \
            --no-default-features --features node-embedded \
            a_windows_runtime_dir_boots -- --ignored --nocapture \
            --test-threads=1 > smoke.log 2>&1 || rc=$?
          cat smoke.log
          if ! grep -qE '1 passed' smoke.log; then
            if grep -q '; 0 filtered out' smoke.log; then
              echo "::error::veilclient-ffi compiled to an EMPTY crate here (0 tests AND 0 filtered out). src/lib.rs is #![cfg(unix)]. Note that a_windows_runtime_dir_boots_a_node_end_to_end is #[cfg(windows)] INSIDE that #![cfg(unix)] crate — an empty intersection, so it can never run on any platform."
            else
              echo "::error::the Windows boot smoke did not execute"
            fi
            exit 1
          fi
          exit $rc

  release-build:
    name: Windows release build (${{ matrix.target }})
    runs-on: windows-latest
    # Release binaries are a release concern, not a per-PR one — a PR that
    # only touches veil-local-transport needs the tests above, not two full
    # release builds. Keeps the new pull_request trigger cheap.
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      # rust-toolchain.toml pins the channel, and the action above installs the
      # target for whatever IT installed — not for the pinned toolchain cargo
      # actually runs. Add it explicitly, which resolves through the pin.
      #
      # Without this the aarch64 leg died in `cfg-if` with "can't find crate for
      # `core`": rustup silently switched to the pinned 1.97.1, which carries
      # only its host target plus the ones rust-toolchain.toml names. The x86_64
      # leg passed throughout and hid it — there, the matrix target IS the host.
      # Same fix, and same reason, as mobile-build.yml.
      - name: Add the cross target to the PINNED toolchain
        run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build production release binaries
        shell: bash
        env:
          CARGO_INCREMENTAL: 0
          CC_x86_64_pc_windows_msvc: clang-cl
          CXX_x86_64_pc_windows_msvc: clang-cl
          CC_aarch64_pc_windows_msvc: clang-cl
          CXX_aarch64_pc_windows_msvc: clang-cl
          CXXFLAGS: ''
        run: |
          cargo build --release --target ${{ matrix.target }} --locked \
            --bin veil-cli --bin ogate --bin oproxy-client --bin oproxy-server \
            --features veil-bootstrap/production-seeds
      - name: Stage Windows artifacts
        shell: bash
        run: |
          stage="target/release-artifacts/${{ matrix.target }}"
          mkdir -p "$stage"
          : > "$stage/sha256.txt"
          for b in veil-cli ogate oproxy-client oproxy-server; do
            src="target/${{ matrix.target }}/release/${b}.exe"
            cp "$src" "$stage/"
            sha256sum "$stage/${b}.exe" | awk -v n="${b}.exe" '{print $1"  "n}' >> "$stage/sha256.txt"
          done
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-release-${{ matrix.target }}
          path: target/release-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 3
