[package]
name = "veil-mainline"
version = "0.11.20"
edition = "2024"
description = "Client for BitTorrent's Mainline DHT (BEP 5): a permissionless rendezvous nobody operates, used as a veil bootstrap layer."
license = "AGPL-3.0-or-later"

[dependencies]
blake3 = "1.5"
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1.42", features = ["net", "rt", "sync", "time", "macros"] }

[dev-dependencies]

[lints]
workspace = true
