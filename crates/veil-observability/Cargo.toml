[package]
name = "veil-observability"
version = "0.11.21"
edition = "2024"
description = "Veil observability: NodeLogger (structured stderr/file/JSON), NodeMetrics (atomic counters + histograms + gauges), MetricsSnapshot for Prometheus scrape. Phase 6 extraction from veilcore."
license = "AGPL-3.0-or-later"

[dependencies]
veil-abuse = { path = "../veil-abuse" }
veil-app = { path = "../veil-app" }
veil-dht = { path = "../veil-dht" }
veil-error = { path = "../veil-error" }
veil-ipc = { path = "../veil-ipc" }
veil-mesh = { path = "../veil-mesh" }
veil-pex = { path = "../veil-pex" }
veil-proto = { path = "../veil-proto" }
veil-proxy = { path = "../veil-proxy" }
veil-routing = { path = "../veil-routing" }
veil-types = { path = "../veil-types" }
veil-update = { path = "../veil-update" }

# Android only, and only so the node's own log can be READ there. `stderr`
# goes nowhere on Android, so the one log that says why discovery happened or
# did not was invisible on the platform where that is hardest to answer.
# `android_logger` (initialised by veilclient-ffi, tag `veilnode`) bridges the
# `log` crate to logcat.
[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"

[lints]
workspace = true
