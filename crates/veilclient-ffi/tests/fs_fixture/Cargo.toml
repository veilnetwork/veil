[package]
name = "veil-fs-test-ffi"
version = "0.0.0"
edition = "2024"
publish = false

# An isolated fixture, not a replacement SDK or a release workspace member.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libc = "=0.2.186"
zeroize = "=1.8.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
