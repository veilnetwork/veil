[package]
name = "veil-ipc"
version = "0.8.9"
edition = "2024"
description = "Local IPC server for the Veil node (Epic 451): authenticated `APP_HELLO` handshake, per-client app-id binding, frame delivery to / from the in-process FrameDispatcher, and the `debug capture` / `transport_hints` / `recursive_query` admin paths.  Phase 6.3 extraction from veilcore — the IPC frame protocol now lives behind a small IpcMetrics trait + an Arc<dyn FrameBroadcaster>, so a stand-alone IPC server can be embedded into a CLI tool or mobile-side daemon without dragging the veilcore runtime."
license = "AGPL-3.0-or-later"

[features]
# Enables integration tests that construct `SessionTxRegistry` /
# `KademliaService` directly.  Off by default so `cargo test -p veil-ipc`
# stays free of those crates; the feature pulls them in optionally rather
# than leaving the tests referencing crates nobody links, which is what made
# `--all-features` fail to compile while every default build stayed green.
#
# There is no dependency cycle to avoid here: neither veil-session nor
# veil-dht depends on veil-ipc.
veilcore-internals-test = []

[dependencies]
veil-abuse = { path = "../veil-abuse" }
veil-anycast = { path = "../veil-anycast" }
veil-app = { path = "../veil-app" }
veil-bufpool = { path = "../veil-bufpool" }
veil-dispatcher-state = { path = "../veil-dispatcher-state" }
veil-e2e = { path = "../veil-e2e" }
veil-error = { path = "../veil-error" }
veil-local-transport = { path = "../veil-local-transport" }
veil-pending-ack = { path = "../veil-pending-ack" }
veil-proto = { path = "../veil-proto" }
veil-routing = { path = "../veil-routing" }
veil-transport = { path = "../veil-transport" }
veil-types = { path = "../veil-types" }
veil-util = { path = "../veil-util" }

blake3 = "1.5"
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2.0"
tokio = { version = "1.42", features = ["sync", "rt", "macros", "time", "io-util", "net"] }

[dev-dependencies]
# Only the tests behind veilcore-internals-test touch these, and only as
# dev-dependencies can they be here at all: veil-session pulls veil-cfg, which
# reaches veil-observability, which depends back on veil-ipc. Cargo permits a
# cycle that passes through a dev-dependency edge and refuses one that does
# not, so a normal dependency - optional or otherwise - is not an option.
veil-dht = { path = "../veil-dht" }
veil-session = { path = "../veil-session" }

[lints]
workspace = true
