[package]
name = "veil-nostr"
version = "0.11.9"
edition = "2024"
description = "A veil meeting point on Nostr relays: the one that survives a network where UDP is gone."
license = "AGPL-3.0-or-later"

[dependencies]
veil-transport = { path = "../veil-transport" }

futures = "0.3"
tokio = { version = "1.42", features = ["rt", "time", "macros"] }
tokio-tungstenite = "0.24"
blake3 = "1.5"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[features]
# Pass-through, as veil-bootstrap does: the public-PKI path uses the
# tls-boring backend (Chrome-like JA3) when this is on, plain rustls otherwise.
tls-boring = ["veil-transport/tls-boring"]

[lints]
workspace = true
