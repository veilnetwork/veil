[package]
name = "veil-nostr"
version = "0.9.1"
edition = "2024"
description = "A veil meeting point on Nostr relays: the one that survives a network where UDP is gone."
license = "AGPL-3.0-or-later"

[dependencies]
blake3 = "1.5"
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints]
workspace = true
